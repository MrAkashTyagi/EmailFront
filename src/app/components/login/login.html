<div class="register-page">

    <div class="register-card">

        <div class="logo-section">

            <div class="logo-icon">
                💒
            </div>

            <h1>
                Welcome Back
            </h1>

            <p>
                Login to continue
            </p>

        </div>

        @if (errorMessage()) {

        <div class="error-message">

            {{ errorMessage() }}

        </div>

        }

        <form
            [formGroup]="loginForm"
            (ngSubmit)="login()"
        >

            <div class="form-group">

                <label>
                    Email
                </label>

                <input
                    type="email"
                    formControlName="email"
                    placeholder="Enter email"
                >

            </div>

            <div class="form-group">

                <label>
                    Password
                </label>

                <input
                    type="password"
                    formControlName="password"
                    placeholder="Enter password"
                >

            </div>

            <button
                type="submit"
                class="register-btn"
                [disabled]="loading()"
            >

                @if (loading()) {

                    Logging in...

                } @else {

                    Login

                }

            </button>

        </form>

        <div class="login-link">

            Don't have an account?

            <a routerLink="/register">
                Register
            </a>

        </div>

    </div>

</div>
