<div class="task-board">

  <div class="task-column">

    <h3>
      To Do
    </h3>

    @for (
      task of todoTasks();
      track task.id
    ) {

      <div class="task-card">

        {{ task.title }}

      </div>

    }

  </div>

  <div class="task-column">

    <h3>
      In Progress
    </h3>

    @for (
      task of inProgressTasks();
      track task.id
    ) {

      <div class="task-card">

        {{ task.title }}

      </div>

    }

  </div>

  <div class="task-column">

    <h3>
      Done
    </h3>

    @for (
      task of completedTasks();
      track task.id
    ) {

      <div class="task-card">

        {{ task.title }}

      </div>

    }

  </div>

</div>
