<div class="dialog-header">

  <div>

    <span class="dialog-eyebrow">
      WEDDING TASK
    </span>

    <h2>
      {{
      isEditMode
      ? 'Edit Task'
      : 'Add Task'
      }}
    </h2>

    <p>
      Wedding planning activity ki details maintain karein.
    </p>

  </div>

  <button mat-icon-button type="button" aria-label="Close dialog" (click)="close()">

    <mat-icon>
      close
    </mat-icon>

  </button>

</div>

<div class="dialog-content">

  <mat-form-field appearance="outline">

    <mat-label>
      Task Title
    </mat-label>

    <input matInput [(ngModel)]="task.title" placeholder="For example, Photographer final karna">

  </mat-form-field>

  <mat-form-field appearance="outline">

    <mat-label>
      Description
    </mat-label>

    <textarea matInput rows="4" [(ngModel)]="task.description" placeholder="Task ke important details">
    </textarea>

  </mat-form-field>

  <div class="form-row">

    <mat-form-field appearance="outline">

      <mat-label>
        Status
      </mat-label>

      <mat-select [(ngModel)]="task.status">

        <mat-option value="TODO">
          To Do
        </mat-option>

        <mat-option value="IN_PROGRESS">
          In Progress
        </mat-option>

        <mat-option value="DONE">
          Done
        </mat-option>

      </mat-select>

    </mat-form-field>

    <mat-form-field appearance="outline">

      <mat-label>
        Priority
      </mat-label>

      <mat-select [(ngModel)]="task.priority">

        <mat-option value="HIGH">
          High
        </mat-option>

        <mat-option value="MEDIUM">
          Medium
        </mat-option>

        <mat-option value="LOW">
          Low
        </mat-option>

      </mat-select>

    </mat-form-field>

  </div>

  <div class="form-row">

    <mat-form-field appearance="outline">

      <mat-label>
        Due Date
      </mat-label>

      <input matInput [matDatepicker]="dueDatePicker" [(ngModel)]="task.dueDate">

      <mat-datepicker-toggle matIconSuffix [for]="dueDatePicker">
      </mat-datepicker-toggle>

      <mat-datepicker #dueDatePicker>
      </mat-datepicker>

    </mat-form-field>

    <mat-form-field appearance="outline">

      <mat-label>
        Assigned To
      </mat-label>

      <input matInput [(ngModel)]="task.assignedTo" placeholder="Person name">

    </mat-form-field>

  </div>

</div>

<div class="dialog-actions">

  <button mat-stroked-button type="button" class="cancel-btn" [disabled]="saving" (click)="close()">

    Cancel

  </button>

  <button mat-flat-button type="button" class="save-btn" [disabled]="saving" (click)="save()">

    <mat-icon>
      {{
      isEditMode
      ? 'save'
      : 'add'
      }}
    </mat-icon>

    {{
    saving
    ? 'Saving...'
    : isEditMode
    ? 'Update Task'
    : 'Add Task'
    }}

  </button>

</div>
