<section class="countdown-hero">

  <div class="couple-name">
    Akash ❤️ {{ settings?.partnerName }}
  </div>

  <div class="wedding-date">
    {{ settings?.weddingDateTime | date:'dd MMMM yyyy • hh:mm a' }}
  </div>

  <div class="countdown-row">

    <div>
      <span class="count-value">
        {{ days() }}
      </span>

      <span class="count-label">
        Days
      </span>
    </div>

    <div>
      <span class="count-value">
        {{ hours() }}
      </span>

      <span class="count-label">
        Hours
      </span>
    </div>

    <div>
      <span class="count-value">
        {{ minutes() }}
      </span>

      <span class="count-label">
        Minutes
      </span>
    </div>

    <div>
      <span class="count-value">
        {{ seconds() }}
      </span>

      <span class="count-label">
        Seconds
      </span>
    </div>

  </div>

</section>
