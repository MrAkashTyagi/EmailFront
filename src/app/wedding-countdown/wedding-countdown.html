@if (!hasWeddingDate()) {

<div class="empty-state">

  <div class="empty-title">

   

    <span>
      Wedding Countdown
    </span>

  </div>

  <p>
    Your wedding date is not configured yet.
  </p>

  <button mat-flat-button class="set-date-btn" (click)="openSettings()">

    Set Wedding Date

  </button>

</div>

} @else {

<section class="countdown-hero">

  <div class="couple-name">

    Akash ❤️
    {{ settings?.partnerName }}

  </div>

  <div class="wedding-date">

    {{
    settings?.weddingDateTime
    | date:'dd MMMM yyyy • hh:mm a'
    }}

  </div>

  <div class="countdown-row">

    <div>

      <span class="count-value">
        {{ days() }}
      </span>

      <span class="count-label">
        Days
      </span>

    </div>

    <div>

      <span class="count-value">
        {{ hours() }}
      </span>

      <span class="count-label">
        Hours
      </span>

    </div>

    <div>

      <span class="count-value">
        {{ minutes() }}
      </span>

      <span class="count-label">
        Minutes
      </span>

    </div>

    <div>

      <span class="count-value">
        {{ seconds() }}
      </span>

      <span class="count-label">
        Seconds
      </span>

    </div>

  </div>

</section>

}
