<div class="dialog-header">

  <h2>
    Expense Bills
  </h2>

  <button mat-icon-button (click)="close()">
    <mat-icon>
      close
    </mat-icon>
  </button>

</div>

<div class="bills-container">

  @for (
  bill of data.bills;
  track bill.id
  ) {

  <div class="bill-card">

    <img [src]="bill.billUrl" class="bill-thumbnail" (click)="openBill(bill)" />

    <div class="bill-name" (click)="openBill(bill)">
      {{ bill.billOriginalName }}
    </div>

    <button mat-icon-button color="warn" (click)="deleteBill(
      $event,
      bill
    )">
      <mat-icon>
        delete
      </mat-icon>
    </button>

  </div>

  }

</div>
