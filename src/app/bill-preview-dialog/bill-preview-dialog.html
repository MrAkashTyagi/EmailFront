<div class="dialog-header">

  <button
    mat-icon-button
    class="close-btn"
    (click)="close()">

    <mat-icon>close</mat-icon>

  </button>

</div>
<div class="preview-container">

  @if (isPdf) {

    <iframe
      [src]="data.url"
      width="100%"
      height="700">
    </iframe>

  } @else {

    <img
      [src]="data.url"
      class="preview-image"
      alt="Bill Preview"
    />

  }

</div>
